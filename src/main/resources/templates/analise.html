<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Lista de Filmes</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" /> 
    </head>
    <body>
        <h1>Detalhes do Filme</h1>

        <p><strong>Título:</strong> <span th:text="${filme.titulo}"></span></p>
        <p><strong>Gênero:</strong> <span th:text="${filme.genero}"></span></p>
        <p><strong>Sinopse:</strong> <span th:text="${filme.sinopse}"></span></p>
        <p><strong>Lançamento:</strong> <span th:text="${filme.lancamento}"></span></p>

        <h2>Adicionar Análise</h2>

        <form th:action="@{/salvar-analise}" method="post">
            <input type="hidden" name="filmeId" th:value="${filme.id}" />

            <p>Análise: <input type="text" name="analise" /></p>
            <p>Nota: <input type="number" name="nota" /></p>
            <input type="submit" value="Salvar Análise" />
        </form>

        <br/>
        <a href="/lista_filmes">
            <button type="button">← Voltar para a lista</button>
        </a>

    </body>
</html>
